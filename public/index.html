<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SV Developers – Team Register</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3faf6;--card:#fff;--ink:#1d1517;--mute:#6b6266;--line:#d9e6de;--red:#0f7a4a;--gold:#d4f0e0;--goldink:#08492c;--soft:#eef6f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.sora{font-family:'Sora','DM Sans',system-ui,sans-serif;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hide{display:none!important}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(100deg,rgba(5,46,29,.9) 0%,rgba(5,46,29,.62) 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero .plots{position:absolute;inset:0;opacity:.18;background:
linear-gradient(90deg,transparent 49.5%,#fff 49.5%,#fff 50.5%,transparent 50.5%) 0 0/90px 90px,
linear-gradient(0deg,transparent 49.5%,#fff 49.5%,#fff 50.5%,transparent 50.5%) 0 0/90px 90px;transform:skewY(-8deg) scale(1.4)}
.brand{font-family:Sora;font-weight:800;font-size:20px;position:relative;display:flex;gap:10px;align-items:center}
.brand i{width:34px;height:34px;border-radius:8px;background:var(--gold);color:#08492c;display:grid;place-items:center;font-style:normal}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.04;font-weight:800;position:relative;max-width:11ch}
.hero p{position:relative;max-width:38ch;opacity:.9}
.ladder-mini{position:relative;display:flex;gap:4px;align-items:flex-end;height:70px}
.ladder-mini span{flex:1;background:var(--gold);border-radius:4px 4px 0 0}
.formwrap{display:grid;place-items:center;padding:32px}
.form{width:min(380px,100%)}
.form h2{font-size:28px;margin-bottom:6px}
label{display:block;font-weight:700;margin:18px 0 6px;font-size:14px}
input[type=text],input[type=password],input[type=search]{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;width:100%;margin-top:22px}
.btn.sm{width:auto;margin:0;padding:9px 14px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.hint{color:var(--mute);font-size:13px;margin-top:14px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.dir{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.dir summary{padding:11px 14px;cursor:pointer;font-weight:700}
.dir .lst{max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.dir button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;background:none;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.dir button:hover{background:var(--soft)}.dir small{color:var(--mute)}.dir code{font-size:12px}
/* app */
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#0b5d3b;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .brand i{width:30px;height:30px}
.who{display:flex;gap:12px;align-items:center;font-size:14px}
.who .btn.sm{color:#fff;border-color:#ffffff66}
main{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.me .av{width:64px;height:64px;font-size:22px}
.av{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--goldink);display:grid;place-items:center;font-weight:800;font-family:Sora;flex:none;font-size:14px}
.me h2{font-size:22px;margin:12px 0 2px}
.rank{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--gold);color:var(--goldink);font-weight:700;font-size:12px}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.rates div{background:var(--soft);border-radius:12px;padding:12px}
.rates b{display:block;font:800 22px Sora}
.rates small,.stat small{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{font:800 28px Sora;display:block}
.stat.hl{background:var(--red);color:#fff;border-color:transparent}.stat.hl small{color:#d4f0e0}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:5px;margin-top:20px}
.ladder button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:var(--soft);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;border-left:6px solid var(--line)}
.ladder button.mine{border-left-color:var(--red);font-weight:700}
.ladder button.on{background:var(--gold);color:var(--goldink)}
.ladder em{font-style:normal;color:var(--mute);font-size:12px}
.ladder .on em{color:var(--goldink)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:22px;padding-left:16px;border-left:2px dashed var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--soft);border-color:var(--line)}
.row .nm{flex:1;min-width:0}.row .nm b{display:block}.row .nm small{color:var(--mute)}
.tg{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;flex:none}
.tg.sp{visibility:hidden}
.pill{font-size:12px;color:var(--mute);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#2a9d5c;display:inline-block;margin-right:5px}.dot.off{background:#b5aaad}
dialog{border:0;border-radius:18px;padding:26px;width:min(440px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
dialog .kv div{background:var(--soft);border-radius:10px;padding:10px 12px}
dialog .kv b{display:block;font-family:Sora}
.empty{padding:30px;text-align:center;color:var(--mute)}
@media(max-width:860px){.login{grid-template-columns:1fr}.hero{min-height:300px;padding:28px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.pill.hd{display:none}header.top{padding:12px 16px}.who span{display:none}}

.roles{display:grid;gap:8px;margin-top:20px}
.roles button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer}
.roles button:hover{border-color:var(--red)}.roles small{color:var(--mute)}
.badge{background:#ffffff26;border-radius:99px;padding:3px 12px;font-weight:700;font-size:13px}
.tbl{overflow:visible}table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:hover td{background:var(--soft)}
.ld{font-size:11px;background:var(--red);color:#fff;border-radius:6px;padding:1px 7px;margin-left:6px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.pend{color:#b45309;font-weight:700;font-size:12px}
.act{display:flex;gap:6px}.act .btn.sm{padding:6px 10px;font-size:13px}
.btn.del{color:#b42318;border-color:#f0c4be}
.banner{background:#fff7e0;border:1px solid #f0d78a;color:#6b4f00;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fg .w{grid-column:1/-1}
.fg label{margin:12px 0 5px}select,input[type=date]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.fe{color:#b42318;font-size:13px;min-height:18px;margin-top:4px}
.dup h3{color:#b42318;font-size:20px;margin-bottom:6px}
.row2{display:flex;gap:10px;margin-top:18px}.row2 .btn{margin:0}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
@media(max-width:600px){.fg{grid-template-columns:1fr}}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:9px 14px;cursor:pointer;font-weight:600;color:var(--ink)}.seg button.on{background:var(--red);color:#fff}
.chart{overflow:auto;padding:6px 0 14px;max-height:78vh}
.fl{display:inline-flex;flex-direction:column;align-items:center;min-width:100%}
.r1{display:flex;align-items:flex-start}
.col{position:relative;padding:22px 8px 0;width:206px;flex:none;display:flex;flex-direction:column;align-items:center}
.col::before{content:'';position:absolute;top:0;left:0;right:0;border-top:2px solid var(--line)}
.col:first-child::before{left:50%}.col:last-child::before{right:50%}.col:only-child::before{display:none}
.col::after{content:'';position:absolute;top:0;left:50%;height:22px;border-left:2px solid var(--line)}
.th{background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;text-align:center;width:100%;cursor:pointer}
.th small{display:block;opacity:.8;font-size:10px;letter-spacing:.1em}.th b{display:block;font-family:Sora;font-size:14px}.th span{font-size:12px;opacity:.9}
.ml{position:relative;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding-top:14px}
.ml::before{content:'';position:absolute;top:0;bottom:14px;left:50%;border-left:2px solid var(--line)}
.mc{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:7px 10px;width:100%;display:flex;flex-direction:column}
.mc b{font-size:13px}.mc small{color:var(--mute);font-size:11px}.mc.lead{background:var(--soft);border-width:2px 2px 2px 6px}
.rootn{position:relative;padding-bottom:22px}.rootn::after{content:'';position:absolute;bottom:0;left:50%;height:22px;border-left:2px solid var(--line)}.rootn .mc{width:230px}
.pr span{font-size:12px;color:var(--mute)}.bar{height:7px;min-width:90px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--red)}
.clk{cursor:pointer}.num{text-align:right;white-space:nowrap}.tot td{font-weight:800;border-top:2px solid var(--line)}
.sec{font-size:16px;margin:18px 0 8px}

<script>
const RANKS=[{"n":"Marketing Chief","c":"MCH","h":"Not listed","f":"Not listed"},{"n":"Marketing President","c":"OMP","h":"2900/- + 100/- transport","f":"30% + 50/- transport"},{"n":"Marketing Vice President","c":"MVP","h":"2650/-","f":"27%"},{"n":"Marketing Senior Director","c":"MSD","h":"2400/-","f":"24%"},{"n":"Marketing Director","c":"OMD","h":"2200/-","f":"22%"},{"n":"Deputy Marketing Director","c":"DMD","h":"2000/-","f":"20%"},{"n":"Assistant Marketing Director","c":"AMD","h":"Not listed","f":"Not listed"},{"n":"Chief General Manager","c":"CGM","h":"1800/-","f":"18%"},{"n":"General Manager","c":"OGM","h":"1600/-","f":"16%"},{"n":"Deputy General Manager","c":"DGM","h":"1400/-","f":"14%"},{"n":"Assistant General Manager","c":"AGM","h":"1200/-","f":"12%"},{"n":"Marketing Manager","c":"OMM","h":"1000/-","f":"10%"},{"n":"Marketing Executive","c":"OME","h":"Not set","f":"Not set"},{"n":"Coupens Tele","c":"CTL","h":"Not set","f":"Not set"},{"n":"Others","c":"OTH","h":"Not set","f":"Not set"}];
const OTH=14;const rn=m=>esc(m.r===OTH&&m.dn?m.dn:rn(m));
const LABEL={admin:'Admin',editor:'Editor',viewer:'Viewer'};let TOKEN='';
const $=id=>document.getElementById(id);
const fmt=d=>{if(!d)return'-';const[y,m,x]=d.split('-');return x+'-'+m+'-'+y};
const ini=s=>s.split(' ').map(x=>x[0]).slice(0,2).join('');
const dig=s=>String(s||'').replace(/\D/g,''),fa=a=>a.replace(/(\d{4})(?=\d)/g,'$1 '),mask=a=>a?'XXXX XXXX '+a.slice(8):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BASE={};
let OV={},dbx=null,role=null,teamF='ALL',view='list';
const idOf=m=>'SVD'+RANKS[m.r].c+m.n;
const merged=()=>{const m={};Object.keys(BASE).forEach(k=>m[k]=BASE[k]);Object.keys(OV).forEach(k=>m[k]={...BASE[k],...OV[k]});return m};
const recs=()=>Object.values(merged()).filter(x=>!x.del).sort((a,b)=>a.n.localeCompare(b.n));
const nextNum=()=>String(Math.max(...Object.keys(merged()).map(Number))+1).padStart(4,'0');
const can=a=>role==='admin'||(role==='editor'&&a!=='del');

function render(){
 const R=recs(),q=$('q').value.trim().toLowerCase(),vw=role==='viewer',T={};
 R.forEach(m=>{const t=T[m.team]=T[m.team]||{n:0,l:''};t.n++;if(m.lead)t.l=m.name});
 const names=Object.keys(T).sort((a,b)=>a==='LEADERS TEAM'?-1:b==='LEADERS TEAM'?1:a.localeCompare(b));
 if(teamF!=='ALL'&&!T[teamF])teamF='ALL';
 const st=[['Members',R.length,1],['Teams',names.length],['Active',R.filter(m=>m.s!=='INACTIVE').length]];
 if(!vw)st.push(['Aadhaar pending',R.filter(m=>!m.aad).length]);
 $('stats').innerHTML=st.map(s=>`<div class="stat ${s[2]?'hl':''}"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('');
 $('teams').innerHTML=`<button data-t="ALL" class="${teamF==='ALL'?'on':''}"><span>All teams</span><em>${R.length}</em></button>`+names.map(t=>`<button data-t="${esc(t)}" class="${teamF===t?'on':''}"><span>${esc(t)}</span><em>${T[t].n}</em></button>`).join('');
 $('teams').querySelectorAll('button').forEach(b=>b.onclick=()=>{teamF=b.dataset.t;render()});
 const L=R.filter(m=>(teamF==='ALL'||m.team===teamF)&&(!q||(m.name+idOf(m)+m.team).toLowerCase().includes(q)));
 $('tt').textContent=teamF==='ALL'?'All members':teamF;
 $('ts').textContent=(teamF!=='ALL'&&T[teamF].l?'Leader: '+T[teamF].l+' · ':'')+L.length+' shown';
 $('add').classList.toggle('hide',!can('add'));
 $('bn').classList.toggle('hide',!(role!=='viewer'&&!dbx));
 $('ren').classList.toggle('hide',!(can('add')&&teamF!=='ALL'));
 [['vl','list'],['vc','chart'],['vp','perf'],['vm','comm']].forEach(([b,v])=>$(b).classList.toggle('on',view===v));
 $('vm').classList.toggle('hide',vw);$('log').classList.toggle('hide',!can('add'));
 $('list').classList.toggle('hide',view!=='list');$('chart').classList.toggle('hide',view!=='chart');
 $('perf').classList.toggle('hide',view!=='perf'&&view!=='comm');$('q').classList.toggle('hide',view!=='list');
 $('mp').classList.toggle('hide',view!=='perf'&&view!=='comm');
 if(view==='chart')drawChart(R,names,T);
 if(view==='perf'||view==='comm')drawPerf(R,names);
 const th=['ID','Name','Rank','Team'].concat(vw?[]:['Phone','Aadhaar']).concat(['Joined','Status',can('add')?'':null]).filter(x=>x!==null);
 $('list').innerHTML=L.length?`<table><thead><tr>${th.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`+L.map(m=>{
  const a=m.aad?(role==='admin'?fa(m.aad):mask(fa(m.aad))):'<span class="pend">Pending</span>';
  return `<tr><td class="mono">${idOf(m)}</td><td><b>${esc(m.name)}</b>${m.lead?'<span class="ld">Leader</span>':''}</td><td>${rn(m)}</td><td>${esc(m.team)}</td>`
  +(vw?'':`<td>${esc(m.ph)||'-'}</td><td class="mono">${a}</td>`)
  +`<td>${fmt(m.d)}</td><td><i class="dot ${m.s==='INACTIVE'?'off':''}"></i>${m.s==='INACTIVE'?'Inactive':'Active'}</td>`
  +(can('add')?`<td class="act"><button class="btn sm" data-e="${m.n}">Edit</button>${can('del')?`<button class="btn sm del" data-x="${m.n}">Delete</button>`:''}</td>`:'')+'</tr>'}).join('')+'</tbody></table>'
  :'<div class="empty">No members match.</div>';
 lab($('list'));$('list').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>openForm(b.dataset.e));
 $('list').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>askDel(b.dataset.x));
}
const RATE=[null,{h:2900,f:30,th:100,tf:50},{h:2650,f:27},{h:2400,f:24},{h:2200,f:22},{h:2000,f:20},null,{h:1800,f:18},{h:1600,f:16},{h:1400,f:14},{h:1200,f:12},{h:1000,f:10},null];
let ACT={};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),zs={v:0,b:0,hq:0,fq:0,fv:0};
function stats(mon){const S={};Object.values(ACT).filter(a=>!a.del&&(a.d||'').slice(0,7)===mon).forEach(a=>{const s=S[a.m]=S[a.m]||{v:0,b:0,hq:0,fq:0,fv:0};if(a.t==='visit')s.v++;else{s.b++;if(a.ty==='FARM'){s.fq+=+a.q||0;s.fv+=+a.val||0}else s.hq+=+a.q||0}});return S}
function comm(m,s){const r=RATE[m.r];if(!r)return{none:1,h:0,f:0,t:0,tot:0};const h=s.hq*r.h,f=s.fv*r.f/100,t=(r.th||0)*s.hq+(r.tf||0)*s.fq;return{h,f,t,tot:h+f+t}}
const bar=(d,t)=>`<div class="pr"><span>${d} / ${t}</span><div class="bar"><i style="width:${t?Math.min(100,d/t*100):0}%"></i></div></div>`;
function drawPerf(R,names){
 const mon=$('mp').value,S=stats(mon),g=m=>S[m.n]||zs,cm=view==='comm',M=merged();
 const mem=R.filter(m=>teamF==='ALL'||m.team===teamF);
 const agg=t=>{const a={n:0,tv:0,v:0,tb:0,b:0,hq:0,fv:0,tot:0};R.filter(m=>m.team===t).forEach(m=>{const s=g(m);a.n++;a.tv+=m.tv||0;a.tb+=m.tb||0;a.v+=s.v;a.b+=s.b;a.hq+=s.hq;a.fv+=s.fv;a.tot+=comm(m,s).tot});return a};
 let h='';
 if(!cm){
  h+=`<h3 class="sora sec">Team performance</h3><table><thead><tr><th>Team</th><th>Members</th><th>Site visits</th><th>Plots booked</th></tr></thead><tbody>`+names.map(t=>{const a=agg(t);return `<tr class="clk" data-t="${esc(t)}"><td><b>${esc(t)}</b></td><td>${a.n}</td><td>${bar(a.v,a.tv)}</td><td>${bar(a.b,a.tb)}</td></tr>`}).join('')+'</tbody></table>';
  h+=`<h3 class="sora sec">${teamF==='ALL'?'All members':esc(teamF)}</h3><table><thead><tr><th>Member</th><th>Rank</th><th>Site visits</th><th>Plots booked</th>${role==='admin'?'<th></th>':''}</tr></thead><tbody>`+mem.map(m=>`<tr><td><b>${esc(m.name)}</b><br><small class="mono">${idOf(m)}</small></td><td>${rn(m)}</td><td>${bar(g(m).v,m.tv||0)}</td><td>${bar(g(m).b,m.tb||0)}</td>${role==='admin'?`<td><button class="btn sm" data-tg="${m.n}">Targets</button></td>`:''}</tr>`).join('')+'</tbody></table>';
  const ids=new Set(mem.map(m=>m.n)),A=Object.values(ACT).filter(a=>!a.del&&(a.d||'').slice(0,7)===mon&&ids.has(a.m)).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,role==='admin'?60:15);
  h+=`<h3 class="sora sec">Recent activity</h3>`+(A.length?'<table><thead><tr><th>Date</th><th>Member</th><th>Activity</th><th>Client</th><th></th></tr></thead><tbody>'+A.map(a=>`<tr><td>${fmt(a.d)}</td><td>${esc(M[a.m]?M[a.m].name:'')}</td><td>${a.t==='visit'?'Site visit':'Plot booking · '+(a.ty==='FARM'?'Farm land · '+inr(a.val):'HMDA/DTCP')+' · '+a.q+' sq yd'+(a.p?' · '+esc(a.p):'')}</td><td>${esc(a.c)}</td><td>${role==='admin'?`<div class="act"><button class="btn sm" data-ae="${a.id}">Edit</button><button class="btn sm del" data-ad="${a.id}">Delete</button></div>`:''}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">Nothing logged for this month.</div>');
 }else{
  h+=`<details class="dir"><summary>Commission rates by rank</summary><div class="lst"><table class="plain" style="min-width:0"><thead><tr><th>Rank</th><th>HMDA / DTCP</th><th>Farm land</th></tr></thead><tbody>${RANKS.map(r=>`<tr><td>${r.n}</td><td>${r.h}</td><td>${r.f}</td></tr>`).join('')}</tbody></table></div></details>
  <div class="hint">Each booking pays the seller at their own rank. HMDA/DTCP = sq yd sold × rate. Farm land = sale value × percentage. Transport (Marketing President only) is added per sq yd.</div>
  <h3 class="sora sec">Team commission</h3><table><thead><tr><th>Team</th><th class="num">HMDA/DTCP sq yd</th><th class="num">Farm sales</th><th class="num">Commission</th></tr></thead><tbody>`+names.map(t=>{const a=agg(t);return `<tr class="clk" data-t="${esc(t)}"><td><b>${esc(t)}</b></td><td class="num">${a.hq}</td><td class="num">${inr(a.fv)}</td><td class="num">${inr(a.tot)}</td></tr>`}).join('')+'</tbody></table>';
  const rows=mem.filter(m=>g(m).b>0);let T={hq:0,fv:0,h:0,f:0,t:0,tot:0};
  h+=`<h3 class="sora sec">${teamF==='ALL'?'All members':esc(teamF)} with bookings</h3>`+(rows.length?'<table><thead><tr><th>Member</th><th>Rank</th><th class="num">HMDA/DTCP sq yd</th><th class="num">Farm sales</th><th class="num">HMDA/DTCP</th><th class="num">Farm</th><th class="num">Transport</th><th class="num">Total</th></tr></thead><tbody>'+rows.map(m=>{const s=g(m),c=comm(m,s);T.hq+=s.hq;T.fv+=s.fv;T.h+=c.h;T.f+=c.f;T.t+=c.t;T.tot+=c.tot;
   return `<tr><td><b>${esc(m.name)}</b><br><small class="mono">${idOf(m)}</small></td><td>${rn(m)}</td><td class="num">${s.hq}</td><td class="num">${inr(s.fv)}</td>`+(c.none?'<td colspan="4"><span class="pend">Rate not set for this rank</span></td>':`<td class="num">${inr(c.h)}</td><td class="num">${inr(c.f)}</td><td class="num">${inr(c.t)}</td><td class="num"><b>${inr(c.tot)}</b></td>`)+'</tr>'}).join('')+`<tr class="tot"><td colspan="2">Total</td><td class="num">${T.hq}</td><td class="num">${inr(T.fv)}</td><td class="num">${inr(T.h)}</td><td class="num">${inr(T.f)}</td><td class="num">${inr(T.t)}</td><td class="num">${inr(T.tot)}</td></tr></tbody></table>`:'<div class="empty">No plot bookings logged for this month.</div>');
 }
 $('perf').innerHTML=h;lab($('perf'));$('perf').querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>{if(role==='admin')openLog(ACT[b.dataset.ae])});$('perf').querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>openTg(b.dataset.tg));
 $('perf').querySelectorAll('.clk').forEach(r=>r.onclick=()=>{teamF=r.dataset.t;render()});
 $('perf').querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{const a=ACT[b.dataset.ad];if(a&&role==='admin')saveAct({...a,del:true})});
}
async function saveAct(a){ACT[a.id]=a;if(dbx){try{await dbx.doc('acts/'+a.id).set(a)}catch(e){delete ACT[a.id];return false}}render();return true}
function lab(box){box.querySelectorAll('table:not(.plain)').forEach(t=>{const H=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());t.querySelectorAll('tbody tr').forEach(r=>{let i=0;[...r.children].forEach(c=>{c.dataset.label=H[i]||'';i+=c.colSpan||1})})})}
function openTg(n){if(role!=='admin')return;const m=merged()[n];
 modal(`<h3 class="sora" style="font-size:20px">Targets · ${esc(m.name)}</h3><div class="hint" style="margin:2px 0 0">Monthly targets, applied to every month.</div><div class="fg"><div><label for="tg1">Site visits</label><input id="tg1" type="number" min="0" value="${m.tv||0}"></div><div><label for="tg2">Plot bookings</label><input id="tg2" type="number" min="0" value="${m.tb||0}"></div></div><div class="fe" id="tge"></div><div class="row2"><button class="btn" id="tgs">Save</button><button class="btn ghost" id="tgc">Cancel</button></div>`);
 $('tgc').onclick=closeM;$('tgs').onclick=async()=>{if(await save({...m,tv:Math.max(0,+$('tg1').value||0),tb:Math.max(0,+$('tg2').value||0)}))closeM();else $('tge').textContent='Could not save. Try again.'}}
function openLog(ed){
 if(!can('add'))return;const today=new Date().toISOString().slice(0,10);
 $('dlg').innerHTML=`<h3 class="sora" style="font-size:20px">${ed?'Edit activity':'Log visit / booking'}</h3><div class="fg">
 <div class="w"><label for="a1">Activity</label><select id="a1"><option value="visit">Site visit</option><option value="book" ${ed&&ed.t==='book'?'selected':''}>Plot booking</option></select></div>
 <div class="w"><label for="a2s">Member</label><input id="a2s" type="search" placeholder="Search by name, ID or team" autocomplete="off"><select id="a2" size="5" style="margin-top:6px" aria-label="Matching members"></select><div class="hint" id="a2h" style="margin:4px 0 0"></div></div>
 <div><label for="a3">Date</label><input id="a3" type="date" value="${ed?ed.d:today}"></div><div><label for="a4">Client name</label><input id="a4" type="text" value="${ed?esc(ed.c):''}"></div>
 <div class="w ${ed&&ed.t==='book'?'':'hide'}" id="bk"><div class="fg"><div><label for="a5">Plot type</label><select id="a5"><option value="HMDA">HMDA / DTCP plot</option><option value="FARM" ${ed&&ed.ty==='FARM'?'selected':''}>Farm land</option></select></div>
 <div><label for="a6">Plot / survey no.</label><input id="a6" type="text" value="${ed?esc(ed.p):''}"></div><div><label for="a7">Area (sq yd)</label><input id="a7" type="number" min="0" value="${ed&&ed.q||''}"></div>
 <div class="${ed&&ed.ty==='FARM'?'':'hide'}" id="vw"><label for="a8">Sale value (₹)</label><input id="a8" type="number" min="0" value="${ed&&ed.val||''}"></div></div></div></div>
 <div class="fe" id="fe"></div><div class="row2"><button class="btn" id="sv">Save</button><button class="btn ghost" id="cn">Cancel</button></div>`;
 $('a1').onchange=()=>$('bk').classList.toggle('hide',$('a1').value!=='book');
 const ML=recs().map(m=>({n:m.n,t:`${m.name} · ${idOf(m)} · ${m.team}`}));
 const fill=q=>{const L=ML.filter(x=>!q||x.t.toLowerCase().includes(q));$('a2').innerHTML=L.length?L.map(x=>`<option value="${x.n}">${esc(x.t)}</option>`).join(''):'<option value="" disabled>No one matches</option>';$('a2').selectedIndex=L.length===1?0:-1;$('a2h').textContent=L.length+' of '+ML.length+' people'};
 fill('');$('a2s').oninput=()=>fill($('a2s').value.trim().toLowerCase());setTimeout(()=>$('a2s').focus(),0);
 if(ed){const em=ML.find(x=>x.n===ed.m);if(em){$('a2s').value=em.t.split(' · ')[1].toLowerCase();fill($('a2s').value);$('a2').value=ed.m}}
 $('a5').onchange=()=>$('vw').classList.toggle('hide',$('a5').value!=='FARM');
 $('cn').onclick=()=>$('dlg').close();
 $('sv').onclick=async()=>{const t=$('a1').value,bk=t==='book',ty=$('a5').value,c=$('a4').value.trim(),q=+$('a7').value,val=+$('a8').value,fe=$('fe');
  if(!$('a2').value){fe.textContent='Pick a member from the list.';return}
  if(!$('a3').value){fe.textContent='Pick a date.';return}
  if(!c){fe.textContent='Enter the client name.';return}
  if(bk&&!(q>0)){fe.textContent='Enter the area in sq yd.';return}
  if(bk&&ty==='FARM'&&!(val>0)){fe.textContent='Enter the sale value for farm land.';return}
  const a={id:ed?ed.id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,m:$('a2').value,d:$('a3').value,c,ty:bk?ty:'',p:bk?$('a6').value.trim():'',q:bk?q:0,val:bk&&ty==='FARM'?val:0,del:false};
  if(await saveAct(a)){$('mp').value=a.d.slice(0,7);$('dlg').close();render()}else fe.textContent='Could not save to the shared database. Try again.'};
 $('dlg').showModal();
}
function drawChart(R,names,T){
 const vis=teamF==='ALL'?names:[teamF],root=R.find(m=>m.team==='LEADERS TEAM'&&m.lead);
 const card=(m,c)=>`<div class="mc ${c||''}" style="border-left-color:hsl(150,55%,${18+m.r*4}%)"><b>${esc(m.name)}</b><small class="mono">${idOf(m)}</small><small>${rn(m)}</small></div>`;
 const col=t=>{const ms=R.filter(m=>m.team===t&&m!==root),ld=ms.filter(m=>m.lead),rest=ms.filter(m=>!m.lead).sort((a,b)=>a.r-b.r||a.n.localeCompare(b.n));
  return `<div class="col"><div class="th" data-t="${esc(t)}" title="Open this team in the list"><small>TEAM</small><b>${esc(t)}</b><span>${T[t].n} member${T[t].n===1?'':'s'}</span></div><div class="ml"><button class="btn sm go" data-t="${esc(t)}">Open this team in the list</button>${ld.concat(rest).map(m=>card(m,m.lead?'lead':'')).join('')}</div></div>`};
 $('chart').innerHTML='<div class="hint" style="margin:0 0 10px">Darker bar means higher rank. <span class="dsk">Click a team name to open it in the list.</span><span class="mob">Tap a team to show its members.</span></div><div class="fl">'+(root?`<div class="rootn">${card(root,'lead')}</div>`:'')+`<div class="r1">${vis.map(col).join('')}</div></div>`;
 $('chart').querySelectorAll('.th').forEach(h=>h.onclick=()=>{if(innerWidth<=700)h.parentElement.classList.toggle('open');else{teamF=h.dataset.t;view='list';render()}});$('chart').querySelectorAll('.go').forEach(b=>b.onclick=()=>{teamF=b.dataset.t;view='list';render()});
}
function openRename(){
 if(!can('add')||teamF==='ALL')return;const old=teamF;
 modal(`<h3 class="sora" style="font-size:20px">Rename team</h3><div class="hint" style="margin:2px 0 0">Current name: <b>${esc(old)}</b>. All its members move to the new name.</div>
 <label for="rn">New team name</label><input id="rn" type="text" value="${esc(old)}"><div class="fe" id="re"></div>
 <div class="row2"><button class="btn" id="rs">Save name</button><button class="btn ghost" id="rc">Cancel</button></div>`);
 $('rc').onclick=closeM;
 $('rs').onclick=async()=>{const nn=$('rn').value.trim().toUpperCase().replace(/\s+/g,' ');
  if(!nn){$('re').textContent='Enter a team name.';return}
  if(nn===old){closeM();return}
  if(recs().some(m=>m.team===nn)){$('re').textContent='A team with this name already exists.';return}
  const list=recs().filter(m=>m.team===old);
  const ok=(await Promise.all(list.map(m=>save({...m,team:nn})))).every(Boolean);
  if(!ok){$('re').textContent='Some members could not be saved. Try again.';return}
  teamF=nn;closeM();render()};
 $('rn').focus();
}
const modal=h=>{$('dup').innerHTML=h;if(!$('dup').open)$('dup').showModal()};
const closeM=()=>$('dup').close();
function dupCheck(n,a){
 const x=recs().find(m=>m.n!==n&&m.aad&&m.aad===a);
 if(!x)return false;
 modal(`<h3 class="sora">This person already exists</h3><div>This Aadhaar number is already in our database.</div>
 <div class="kv" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0"><div style="background:var(--soft);border-radius:10px;padding:10px 12px"><small>Name</small><b style="display:block">${esc(x.name)}</b></div>
 <div style="background:var(--soft);border-radius:10px;padding:10px 12px"><small>ID</small><b style="display:block">${idOf(x)}</b></div>
 <div style="background:var(--soft);border-radius:10px;padding:10px 12px"><small>Present in team</small><b style="display:block">${esc(x.team)}</b></div>
 <div style="background:var(--soft);border-radius:10px;padding:10px 12px"><small>Rank</small><b style="display:block">${rn(x)}</b></div></div>
 <div class="row2"><button class="btn" id="okd">Go back</button></div>`);
 $('okd').onclick=closeM;return true;
}
function openForm(n){
 if(!can('add'))return;
 const nw=!n,m=nw?{n:nextNum(),name:'',r:12,ph:'',d:new Date().toISOString().slice(0,10),s:'ACTIVE',team:teamF==='ALL'?'SV DEVELOPERS':teamF,lead:false,aad:''}:merged()[n];
 const teams=[...new Set(recs().map(x=>x.team))];
 $('dlg').innerHTML=`<h3 class="sora" style="font-size:20px">${nw?'Add member':'Edit member'}</h3><div class="hint" style="margin:2px 0 0">ID <b class="mono" id="pid"></b></div>
 <div class="fg"><div class="w"><label for="f1">Full name</label><input id="f1" type="text" value="${esc(m.name)}"></div>
 <div class="w"><label for="f2">Aadhaar number (unique)</label><input id="f2" type="text" inputmode="numeric" maxlength="14" value="${fa(m.aad)}" placeholder="0000 0000 0000"><div class="fe" id="e2"></div></div>
 <div><label for="f3">Phone</label><input id="f3" type="text" inputmode="numeric" maxlength="10" value="${esc(m.ph)}"></div>
 <div><label for="f4">Rank</label><select id="f4">${RANKS.map((r,i)=>`<option value="${i}" ${i===m.r?'selected':''}>${r.n} (${r.c})</option>`).join('')}</select></div>
 <div class="w ${m.r===OTH?'':'hide'}" id="odw"><label for="f14">Specify designation</label><input id="f14" type="text" value="${esc(m.dn||'')}" placeholder="e.g. Accountant"></div>
 <div><label for="f5">Team</label><input id="f5" list="tl" type="text" value="${esc(m.team)}"><datalist id="tl">${teams.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
 <div><label for="f6">Date of joining</label><input id="f6" type="date" value="${m.d}"></div>
 <div><label for="f10">PAN number</label><input id="f10" type="text" maxlength="10" value="${esc(m.pan||'')}" placeholder="ABCDE1234F"></div><div><label for="f11">Father / spouse name</label><input id="f11" type="text" value="${esc(m.fs||'')}"></div>
 <div><label for="f12">Sponsor</label><input id="f12" type="text" value="${esc(m.sp||'')}"></div><div class="w"><label for="f13">Address</label><input id="f13" type="text" value="${esc(m.ad||'')}"></div>
 <div><label for="f8">Monthly site-visit target</label><input id="f8" type="number" min="0" value="${m.tv||0}"></div><div><label for="f9">Monthly plot-booking target</label><input id="f9" type="number" min="0" value="${m.tb||0}"></div>
 <div class="w"><label for="f7">Status</label><select id="f7"><option value="ACTIVE" ${m.s!=='INACTIVE'?'selected':''}>Active</option><option value="INACTIVE" ${m.s==='INACTIVE'?'selected':''}>Inactive</option></select></div></div>
 <div class="fe" id="fe"></div><div class="row2"><button class="btn" id="sv">Save</button><button class="btn ghost" id="cn">Cancel</button></div>`;
 const pid=()=>$('pid').textContent=idOf({n:m.n,r:+$('f4').value});pid();$('f4').onchange=()=>{pid();$('odw').classList.toggle('hide',+$('f4').value!==OTH)};
 $('f2').oninput=()=>{const v=dig($('f2').value).slice(0,12);$('f2').value=fa(v);$('e2').textContent=''};
 $('f2').onchange=()=>{const v=dig($('f2').value);if(v.length===12&&/^[2-9]/.test(v))dupCheck(m.n,v)};
 $('cn').onclick=()=>$('dlg').close();
 $('sv').onclick=async()=>{
  const name=$('f1').value.trim().toUpperCase(),a=dig($('f2').value),ph=dig($('f3').value),fe=$('fe');
  if(!name){fe.textContent='Enter the full name.';return}
  if(a.length!==12||!/^[2-9]/.test(a)){$('e2').textContent='Aadhaar must be 12 digits and cannot start with 0 or 1.';return}
  if(ph&&ph.length!==10){fe.textContent='Phone must be 10 digits.';return}
  const pan=$('f10').value.replace(/\s/g,'').toUpperCase();if(pan&&!/^[A-Z]{5}\d{4}[A-Z]$/.test(pan)){fe.textContent='PAN must look like ABCDE1234F.';return}
  if(+$('f4').value===OTH&&!$('f14').value.trim()){fe.textContent='Type the designation for Others.';return}
  if(dupCheck(m.n,a))return;
  const team=$('f5').value.trim().toUpperCase()||'SV DEVELOPERS';
  const rec={...m,name,aad:a,ph,r:+$('f4').value,dn:+$('f4').value===OTH?$('f14').value.trim():'',team,d:$('f6').value,s:$('f7').value,tv:Math.max(0,+$('f8').value||0),tb:Math.max(0,+$('f9').value||0),pan,fs:$('f11').value.trim().toUpperCase(),sp:$('f12').value.trim().toUpperCase(),ad:$('f13').value.trim().toUpperCase()};
  if(await save(rec))$('dlg').close();else fe.textContent='Could not save to the shared database. Try again.';
 };
 $('dlg').showModal();
}
async function save(rec){
 OV[rec.n]=rec;
 if(dbx){try{await dbx.doc('members/'+rec.n).set(rec)}catch(e){delete OV[rec.n];return false}}
 render();return true;
}
function askDel(n){if(!can('del'))return;const m=merged()[n];
 modal(`<h3 class="sora" style="font-size:20px">Delete ${esc(m.name)}?</h3><div>${idOf(m)} will be removed from ${esc(m.team)}.</div>
 <div class="row2"><button class="btn del" id="yd" style="background:#b42318;color:#fff;border:0">Delete</button><button class="btn ghost" id="nd">Cancel</button></div>`);
 $('nd').onclick=closeM;$('yd').onclick=async()=>{await save({...m,del:true});closeM()};
}
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
$('q').oninput=render;
$('add').onclick=()=>openForm();$('log').onclick=openLog;$('vp').onclick=()=>{view='perf';render()};$('vm').onclick=()=>{view='comm';render()};$('mp').onchange=render;$('hlogo').src=document.querySelector('#login .brand.logo img').src;$('ren').onclick=openRename;$('vl').onclick=()=>{view='list';render()};$('vc').onclick=()=>{view='chart';render()};
$('go').onclick=async()=>{const un=$('u').value.trim().toLowerCase(),btn=$('go');
 if(!un||!$('pw').value){$('err').textContent='Enter your username and password.';return}
 btn.disabled=true;$('err').textContent='';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:un,p:$('pw').value})});
  if(!r.ok){$('err').textContent=r.status===401?'Wrong username or password.':'Login is not available right now. Try again.';btn.disabled=false;return}
  const j=await r.json();TOKEN=j.token;role=j.role;
  const pr=await fetch('/api/people',{headers:{Authorization:'Bearer '+TOKEN}});
  if(!pr.ok)throw 0;
  Object.keys(BASE).forEach(k=>delete BASE[k]);(await pr.json()).forEach(p=>BASE[p.n]=p);
 }catch(e){$('err').textContent='Could not sign in. Check your connection and try again.';btn.disabled=false;return}
 btn.disabled=false;$('pw').value='';
 $('login').classList.add('hide');$('app').classList.remove('hide');document.body.classList.add('in');window.scrollTo(0,0);
 $('rl').textContent=LABEL[role]+' access';teamF='ALL';view='list';$('q').value='';$('mp').value=new Date().toISOString().slice(0,7);render()};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('pwt').onclick=()=>{const h=$('pw').type==='password';$('pw').type=h?'text':'password';$('pwt').textContent=h?'Hide':'Show';$('pwt').setAttribute('aria-pressed',h);$('pwt').setAttribute('aria-label',h?'Hide password':'Show password')};
$('out').onclick=()=>{role=null;TOKEN='';OV={};Object.keys(BASE).forEach(k=>delete BASE[k]);document.body.classList.remove('in');$('app').classList.add('hide');$('login').classList.remove('hide')};
(async()=>{try{if(window.claude){dbx=await claude.use('db');
 if(dbx)dbx.collection('acts').onSnapshot(s=>{ACT={};s.docs.forEach(d=>ACT[d.id]=d.data());if(role)render()},()=>{});
 if(dbx)dbx.collection('members').onSnapshot(s=>{OV={};s.docs.forEach(d=>OV[d.id]=d.data());if(role)render()},()=>{});}}catch(e){dbx=null}
 if(role)render()})();
</script>
